name = "fluencerfinder"
main = "worker.js"
compatibility_date = "2024-09-23"

# Worker serves the built SPA via the ASSETS binding and proxies API paths to
# the Render backend from the same origin (see worker.js). Same-origin calls
# avoid CORS and ad-blocker (ERR_BLOCKED_BY_CLIENT) issues.
[vars]
# Backend the Worker proxies API paths to. Currently a local dev server exposed
# via an ngrok static domain. Repoint here (or override in the dashboard) to
# switch backends. Defined in config so `wrangler deploy` can't wipe it.
API_ORIGIN = "https://boots-amiable-dimple.ngrok-free.dev"

[assets]
directory = "creator-discovery/frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Keep-alive: ping the Render backend every 10 min so the free tier stays warm
# (Render spins down after ~15 min idle). See scheduled() in worker.js.
[triggers]
crons = ["*/10 * * * *"]
