# Deploy the FastAPI backend (creator-discovery/) to Render.
# Then set API_ORIGIN on Cloudflare Pages to the Render URL.

services:
  - type: web
    name: fluencerfinder-api
    runtime: python
    rootDir: creator-discovery
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: SUPABASE_POOLER_HOST
        sync: false
      - key: SUPABASE_POOLER_PORT
        value: "5432"
      - key: OPENAI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://fluencerfinder.pages.dev,http://localhost:5175
